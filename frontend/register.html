<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DocuMind AI — Register</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="auth-container">
    <div class="auth-card">

        <div class="logo" style="justify-content:center; margin-bottom:24px;">
            <div class="logo-icon">🧠</div>
            DocuMind AI
        </div>

        <div class="auth-title" style="text-align:center;">Create account</div>
        <div class="auth-subtitle" style="text-align:center;">Start asking questions about your documents</div>

        <div id="alert" class="alert"></div>

        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" placeholder="choose a username" autocomplete="username">
        </div>

        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="you@example.com" autocomplete="email">
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="min 8 characters" autocomplete="new-password">
        </div>

        <button class="btn-primary" id="registerBtn" onclick="register()">
            Create account
        </button>

        <div class="auth-link">
            Already have an account? <a href="index.html">Sign in</a>
        </div>

    </div>
</div>

<script>
    const API = 'http://localhost:8000';

    document.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') register();
    });

    async function register() {
        const username = document.getElementById('username').value.trim();
        const email    = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value.trim();
        const btn      = document.getElementById('registerBtn');

        if (!username || !email || !password) {
            showAlert('Fill in all fields.', 'error');
            return;
        }

        btn.disabled  = true;
        btn.innerHTML = '<span class="spinner"></span>';

        try {
            const res  = await fetch(`${API}/users/register`, {
                method:  'POST',
                headers: { 'Content-Type': 'application/json' },
                body:    JSON.stringify({ username, email, password })
            });

            const data = await res.json();

            if (!res.ok) {
                showAlert(data.detail || 'Registration failed.', 'error');
                return;
            }

            showAlert('Account created! Redirecting to login...', 'success');
            setTimeout(() => window.location.href = 'index.html', 1500);

        } catch (err) {
            showAlert('Could not connect to server.', 'error');
        } finally {
            btn.disabled  = false;
            btn.innerHTML = 'Create account';
        }
    }

    function showAlert(msg, type) {
        const el      = document.getElementById('alert');
        el.textContent = msg;
        el.className   = `alert ${type}`;
    }
</script>

</body>
</html>
